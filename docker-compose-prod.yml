version: '3.1'
services:
    redis:
        image: 'redis:alpine'

    mysql:
        image: 'mysql:5.7'
        working_dir: /application
        container_name: 'site_db'
        volumes:
            - './phpdocker/mysql/data:/var/lib/mysql'
        environment:
            - MYSQL_ROOT_PASSWORD=livre
            - MYSQL_DATABASE=site
            - MYSQL_USER=admin
            - MYSQL_PASSWORD=livre
        ports:
            - '42002:3306'
        networks:
            - nginx-proxy_default

    webserver:
        image: 'nginx:alpine'
        container_name: 'siteweb-vue'
        working_dir: /application
        volumes:
            - '.:/application'
            - './phpdocker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf'
        ports:
            - '5050:80'
        environment:
            - VIRTUAL_HOST=${VIRTUAL_HOST}
            - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
            - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
        networks:
            - nginx-proxy_default

    php-fpm:
        build: phpdocker/php-fpm
        working_dir: /application
        container_name: site_php
        volumes:
            - '.:/application'
            - '.env:/application/.env'
            - './phpdocker/php-fpm/php-ini-overrides.ini:/etc/php/7.4/fpm/conf.d/99-overrides.ini'
        networks:
            - nginx-proxy_default

networks:
  nginx-proxy_default:
    external: true